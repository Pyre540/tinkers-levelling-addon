# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

mod_version=1.4.3

# Minecraft Version Information
minecraft_version=1.20.1
minecraft_range=[1.20.1,1.20.2)

# Forge Version Information
forge_version=47.4.22
# Support "any" forge version to ensure we support Neo too
loader_range=*
forge_range=*
parchment_version=2023.09.03

# Build Dependencies
mantle_version=1.11.113
tinkers_version=3.12.0.220
tinkers_range=[3.12.0.220,)
jei_version=15.59.0.210